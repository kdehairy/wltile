name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "wltile-core-v*"
  pull_request:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: make verify

  rust-latest:
    name: rust-latest
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: make build
      - run: make unit-test

  rust-nightly:
    name: rust-nightly
    runs-on: ubuntu-latest
    needs: verify
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: make build
      - run: make unit-test

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: make coverage INTEGRATION_TEST_THREADS=2
      - name: Coverage summary
        run: |
          {
            echo '```'
            cat target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/coverage/html

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - rust-latest
      - integration-test
    # `vX.Y.Z` tags release wltile; `wltile-core-vX.Y.Z` tags release wltile-core.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/wltile-core-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: running release job
        run: echo "running release job"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # Keep the repo's "Latest" release pointing at the wltile CLI.
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
